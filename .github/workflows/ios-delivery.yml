name: iPhone and Android delivery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: bash tool/ios_check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DurakNearby-iOS
          path: |
            dist/*.ipa
            dist/*.zip
            dist/ios-build-info.json
            docs/qa/ios/
          if-no-files-found: warn
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: DurakNearby-Android
          path: build/app/outputs/flutter-apk/app-release.apk
